- name: Artificial Intelligence
  id: CSCE580
  website: https://pooyanjamshidi.github.io/csce580/
  description: This undergraduate course will introduce the basic ideas and techniques underlying the design of intelligent computer-based systems. In this course, a specific emphasis will be on statistical inference and machine learning. Students learn how to build real AI systems that make decisions and act in fully informed, partially observable, or adversarial environments.

- name: Machie Learning Systems
  id: CSCE 585
  website: https://pooyanjamshidi.github.io/mls/
  description: There is a lot more to AI/ML than just implementing an algorithm or a technique. In this graduate course, students will work on deploying a deep learning system into production. By the end of the course, students will be able to apply deep learning, in whatever problem you are interested in, at scale and learn how to deal with unique challenges that only may happen when building production-ready AI/ML systems.
  