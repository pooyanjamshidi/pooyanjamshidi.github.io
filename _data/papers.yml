- id: modular-perf
  title: "Hardness, Structural Knowledge, and Opportunity: An Analytical Framework for Modular Performance Modeling"
  authors: Omid Gheibi, Christian Kaetner, Pooyan Jamshidi
  venue: Arxiv
  venue_abb: TOSEM
  acc_rate:
  year: 2025
  url: https://arxiv.org/abs/2509.11000
  code: https://github.com/dimoibiehg/ModularSystemSimulation
  data: https://github.com/dimoibiehg/DeathStarBenchIVsMeasurement 
  video:
  slide: 
  important: 
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Performance-influence models are beneficial for understanding how configurations affect system performance, but their creation is challenging due to the exponential growth of configuration spaces. While gray-box approaches leverage selective structural knowledge (like the module execution graph of the system) to improve modeling, the relationship between this knowledge, a system's characteristics (we call them structural aspects), and potential model improvements is not well understood. This paper addresses this gap by formally investigating how variations in structural aspects (e.g., the number of modules and options per module) and the level of structural knowledge impact the creation of opportunities for improved modular performance modeling. We introduce and quantify the concept of modeling hardness, defined as the inherent difficulty of performance modeling. Through controlled experiments with synthetic system models, we establish an analytical matrix to measure these concepts. Our findings show that modeling hardness is primarily driven by the number of modules and configuration options per module. More importantly, we demonstrate that both higher levels of structural knowledge and increased modeling hardness significantly enhance the opportunity for improvement. The impact of these factors varies by performance metric; for ranking accuracy (e.g., in debugging task), structural knowledge is more dominant, while for prediction accuracy (e.g., in resource management task), hardness plays a stronger role. These results provide actionable insights for system designers, guiding them to strategically allocate time and select appropriate modeling approaches based on a system's characteristics and a given task's objectives."

- id: robust-emp-ssl
  title: "An Empirical Study of Accuracy-Robustness Tradeoff and Training Efficiency in Self-Supervised Learning"
  authors: Fatemeh Ghofrani, Mehdi Yaghouti, Pooyan Jamshidi
  venue: Transactions on Machine Learning Research
  venue_abb: TMLR
  acc_rate:
  year: 2025
  url: https://arxiv.org/abs/2501.03507
  code: https://github.com/softsys4ai/CF-AMC-SSL
  video:
  slide: 
  important: 
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Self-supervised learning (SSL) has made significant strides in learning image representations, yet its principles remain partially understood, particularly in adversarial scenarios. This work explores the interplay between SSL and adversarial training (AT), focusing on whether this integration can yield robust representations that balance computational efficiency, clean accuracy, and robustness. A major challenge lies in the inherently high cost of AT, which combines an inner maximization problem (generating adversarial examples) with an outer minimization problem (training representations). This challenge is exacerbated by the extensive training epochs required for SSL convergence, which become even more demanding in adversarial settings. Recent advances in SSL, such as Extreme-Multi-Patch Self-Supervised Learning (EMP-SSL), have demonstrated that increasing the number of patches per image instance can significantly reduce the number of training epochs. Building on this, we introduce Robust-EMP-SSL, an extension of EMP-SSL specifically designed for adversarial training scenarios. Robust-EMP-SSL is a framework that leverages multiple crops per image to enhance data diversity, integrates invariance terms with regularization to prevent collapse, and optimizes adversarial training efficiency by reducing the required training epochs. By aligning these components, Robust-EMP-SSL enables the learning of robust representations while addressing the high computational costs and accuracy trade-offs inherent in adversarial training. This study poses a central question: How can multiple crops or diverse patches, combined with adversarial training strategies, achieve trade-offs between computational efficiency, clean accuracy, and robustness? Our empirical results show that Robust-EMP-SSL not only accelerates convergence, but also achieves a superior balance between clean accuracy and adversarial robustness, outperforming SimCLR, a widely used self-supervised baseline that, like other methods, relies on only two augmentations. Furthermore, we propose the Cost-Free Adversarial Multi-Crop Self-Supervised Learning (CF-AMC-SSL) method, which incorporates free adversarial training into the multi-crop SSL framework. CF-AMC-SSL demonstrates the potential to enhance both clean accuracy and adversarial robustness under reduced epoch conditions, further improving efficiency. These findings highlight the potential of Robust-EMP-SSL and CF-AMC-SSL to make SSL more practical in adversarial scenarios, paving the way for future empirical explorations and real-world applications."

- id: SelfXit-TMLR
  title: "SelfXit: An Unsupervised Early Exit Mechanism for Deep Neural Networks"
  authors: Hossein KhademSohi, Mohammadamin Abedi, Yani Ioannou, Steve Drew, Pooyan Jamshidi, and Hadi Hemmati
  venue: Transactions on Machine Learning Research
  venue_abb: TMLR
  acc_rate:
  year: 2024
  url: https://openreview.net/forum?id=h4rUKKfl5S
  code: https://github.com/hoseinkhs/AutoCacheLayer/
  video:
  slide:
  important: 1
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Deep Neural Networks (DNNs) have become an essential component in many application domains, including web-based services. A variety of these services require high throughput and (close to) real-time features, for instance, to respond or react to users’ requests or to process a stream of incoming data on time. However, the trend in DNN design is towards larger models with many layers and parameters to achieve more accurate results. Although these models are often pre-trained, the computational complexity in such large models can still be relatively significant, hindering low inference latency. In this paper, we propose an end-to-end automated early exiting solution to improve the performance of DNN-based vision services in terms of computational complexity and inference latency. Our method adopts the ideas of self-distillation of DNN models and early exits specifically for vision applications. The proposed solution is an automated unsupervised early exiting mechanism that allows early exiting of a large model during inference time if the early exit model in one of the early exits is confident enough for final prediction. One of the main contributions of this paper is that we have implemented the idea as an unsupervised early exiting, meaning that the early exit models do not need access to training data and perform solely based on the incoming data at run-time, making it suitable for applications using pre-trained models. The results of our experiments on two vision tasks (image classification and object detection) show that, on average, early exiting can reduce the computational complexity of these services up to 58% (in terms of FLOP count) and improve their inference latency up to 46% with a low to zero reduction in accuracy. Our approach also outperforms existing methods, particularly on complex models and larger datasets. It achieves a notable reduction in latency of 51.6% and 30.4% on CIFAR100-Resnet50, with an accompanying increase in accuracy of 2.31% and 0.72%, on average, compared to GATI and BranchyNet."

- id: sponge
  title: "Sponge: Inference Serving with Dynamic SLOs Using In-Place Vertical Scaling"
  authors: Kamran Razavi, Saeid Ghafouri, Max Mühlhäuser, Pooyan Jamshidi, Lin Wang
  venue: ACM EuroMLSys@EuroSys
  venue_abb: EuroMLSys
  acc_rate:
  year: 2024
  url: https://fileserver.tk.informatik.tu-darmstadt.de/Publications/2024/razavi2024sponge.pdf
  code: https://github.com/saeid93/sponge
  video: https://www.youtube.com/watch?v=2j9aPMcC7AY
  slide: https://www.cl.cam.ac.uk/research/srg/netos/euromlsys2024/slides/P_3_16.pdf
  important: 
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Mobile and IoT applications increasingly adopt deep learning inference to provide intelligence. Inference requests are typically sent to a cloud infrastructure over a wireless network that is highly variable, leading to the challenge of dynamic Service Level Objectives (SLOs) at the request level. This paper presents Sponge, a novel deep learning inference serving system that maximizes resource efficiency while guaranteeing dynamic SLOs. Sponge achieves its goal by applying in-place vertical scaling, dynamic batching, and request reordering. Specifically, we introduce an Integer Programming formulation to capture the resource allocation problem, providing a mathematical model of the relationship between latency, batch size, and resources. We demonstrate the potential of Sponge through a prototype implementation and preliminary experiments and discuss future works."

- id: cure
  title: "CURE: Simulation-Augmented Auto-Tuning in Robotics"
  authors: Md Abir Hossen, Sonam Kharade, Jason M. O'Kane, Bradley Schmerl, David Garlan, Pooyan Jamshidi
  venue: IEEE Transactions on Robotics
  venue_abb: T-RO
  acc_rate:
  year: 2025
  url: https://arxiv.org/abs/2402.05399
  code: https://github.com/softsys4ai/cure
  video: 
  slide: 
  important: 1
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Robotic systems are typically composed of various subsystems, such as localization and navigation, each encompassing numerous configurable components (e.g., selecting different planning algorithms). Once an algorithm has been selected for a component, its associated configuration options must be set to the appropriate values. Configuration options across the system stack interact non-trivially. Finding optimal configurations for highly configurable robots to achieve desired performance poses a significant challenge due to the interactions between configuration options across software and hardware that result in an exponentially large and complex configuration space. These challenges are further compounded by the need for transferability between different environments and robotic platforms. Data efficient optimization algorithms (e.g., Bayesian optimization) have been increasingly employed to automate the tuning of configurable parameters in cyber-physical systems. However, such optimization algorithms converge at later stages, often after exhausting the allocated budget (e.g., optimization steps, allotted time) and lacking transferability. This paper proposes CURE -- a method that identifies causally relevant configuration options, enabling the optimization process to operate in a reduced search space, thereby enabling faster optimization of robot performance. CURE abstracts the causal relationships between various configuration options and robot performance objectives by learning a causal model in the source (a low-cost environment such as the Gazebo simulator) and applying the learned knowledge to perform optimization in the target (e.g., Turtlebot 3 physical robot). We demonstrate the effectiveness and transferability of CURE by conducting experiments that involve varying degrees of deployment changes in both physical robots and simulation."
  
- id: se4robotics
  title: "Software Engineering for Robotics: Future Research Directions"
  authors: Claire Le Goues, Sebastian Elbaum, David Anthony, Celik Berkay, Mauricio Castillo-Effen, Nikolaus Correll, Pooyan Jamshidi, Morgan Quigley, Trenton Tabor, and Qi Zhu
  venue: Arxiv
  venue_abb: Arxiv
  acc_rate:
  year: 2024
  url: https://arxiv.org/abs/2401.12317
  code:
  video:
  slide: 
  important: 
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Robots are experiencing a revolution as they permeate many aspects of our daily lives, from performing house maintenance to infrastructure inspection, from efficiently warehousing goods to autonomous vehicles, and more. This technical progress and its impact are astounding. This revolution, however, is outstripping the capabilities of existing software development processes, techniques, and tools, which largely have remained unchanged for decades. These capabilities are ill-suited to handling the challenges unique to robotics software such as dealing with a wide diversity of domains, heterogeneous hardware, programmed and learned components, complex physical environments captured and modeled with uncertainty, emergent behaviors that include human interactions, and scalability demands that span across multiple dimensions. Looking ahead to the need to develop software for robots that are ever more ubiquitous, autonomous, and reliant on complex adaptive components, hardware, and data, motivated an NSF-sponsored community workshop on the subject of Software Engineering for Robotics, held in Detroit, Michigan in October 2023. The goal of the workshop was to bring together thought leaders across robotics and software engineering to coalesce a community, and identify key problems in the area of SE for robotics that that community should aim to solve over the next 5 years. This report serves to summarize the motivation, activities, and findings of that workshop, in particular by articulating the challenges unique to robot software, and identifying a vision for fruitful near-term research directions to tackle them."

- id: ipa
  title: "IPA: Inference Pipeline Adaptation to Achieve High Accuracy and Cost-Efficiency"
  authors: Saeid Ghafouri, Kamran Razavi, Mehran Salmani, Alireza Sanaee, Tania Lorido-Botran, Lin Wang, Joseph Doyle, Pooyan Jamshidi
  venue: Journal of Systems Research
  venue_abb: JSys
  acc_rate:
  year: 2024
  url: https://arxiv.org/abs/2308.12871
  code: https://github.com/reconfigurable-ml-pipeline/ipa
  video:
  slide: 
  important: 1
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Efficiently optimizing multi-model inference pipelines for fast, accurate, and cost-effective inference is a crucial challenge in ML production systems, given their tight end-to-end latency requirements. To simplify the exploration of the vast and intricate trade-off space of accuracy and cost in inference pipelines, providers frequently opt to consider one of them. However, the challenge lies in reconciling accuracy and cost trade-offs. To address this challenge and propose a solution to efficiently manage model variants in inference pipelines, we present IPA, an online deep-learning Inference Pipeline Adaptation system that efficiently leverages model variants for each deep learning task. Model variants are different versions of pre-trained models for the same deep learning task with variations in resource requirements, latency, and accuracy. IPA dynamically configures batch size, replication, and model variants to optimize accuracy, minimize costs, and meet user-defined latency SLAs using Integer Programming. It supports multi-objective settings for achieving different trade-offs between accuracy and cost objectives while remaining adaptable to varying workloads and dynamic traffic patterns. Extensive experiments on a Kubernetes implementation with five real-world inference pipelines demonstrate that IPA improves normalized accuracy by up to 35% with a minimal cost increase of less than 5%."

- id: contrastive-empirical
  title: "Rethinking Robust Contrastive Learning from the Adversarial Perspective"
  authors: Fatemeh Ghofrani, Mehdi Yaghouti, Pooyan Jamshidi
  venue: New Frontiers in Adversarial Machine Learning at ICML'23
  venue_abb: AdvML-Frontiers'23
  acc_rate:
  year: 2023
  url: https://arxiv.org/abs/2302.02502
  code: https://github.com/softsys4ai/cl-robustness
  video:
  slide: 
  important: 
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "To advance the understanding of robust deep learning, we delve into the effects of adversarial training on self-supervised and supervised contrastive learning alongside supervised learning. Our analysis uncovers significant disparities between adversarial and clean representations in standard-trained networks across various learning algorithms. Remarkably, adversarial training mitigates these disparities and fosters the convergence of representations toward a universal set, regardless of the learning scheme used. Additionally, increasing the similarity between adversarial and clean representations, particularly near the end of the network, enhances network robustness. These findings offer valuable insights for designing and training effective and robust deep learning networks."

- id: cameo
  title: "CAMEO: A Causal Transfer Learning Approach for Performance Optimization of Configurable Computer Systems"
  authors: Shahriar Iqbal, Ziyuan Zhong, Iftakhar Ahmad, Baishakhi Ray, Pooyan Jamshidi
  venue: ACM Symposium on Cloud Computing
  venue_abb: SoCC
  acc_rate: 29
  year: 2023
  url: https://arxiv.org/abs/2306.07888
  code: https://github.com/softsys4ai/cameo
  video: 
  slide: 
  important: 1    
  badge-available: 
  badge-functional: 
  badge-reproduced: 
  abstract: "Modern computer systems are highly-configurable, with hundreds of configuration options interacting, resulting in enormous configuration space. As a result, optimizing performance goals (e.g., latency) in such systems is challenging. Worse, owing to evolving application requirements and user specifications, these systems face frequent uncertainties in their environments (e.g., hardware and workload change), making performance optimization even more challenging. Recently, transfer learning has been applied to address this problem by reusing knowledge from the offline configuration measurements of an old environment, aka, source to a new environment, aka, target. These approaches typically rely on predictive machine learning (ML) models to guide the search for finding interventions to optimize performance. However, previous empirical research showed that statistical models might perform poorly when the deployment environment changes because the independent and identically distributed (i.i.d.) assumption no longer holds. To address this issue, we propose Cameo -- a method that sidesteps these limitations by identifying invariant causal predictors under environmental changes, enabling the optimization process to operate on a reduced search space, leading to faster system performance optimization. We demonstrate significant performance improvements over the state-of-the-art optimization methods on five highly configurable computer systems, including three MLperf deep learning benchmark systems, a video analytics pipeline, and a database system, and studied the effectiveness in design explorations with different varieties and severity of environmental changes and show the scalability of our approach to colossal configuration spaces."

- id: interactive
  title: "Introducing Interactions in Multi-Objective Optimization of Software Architectures"
  authors: Vittorio Cortellessa, J. Andres Diaz-Pace, Daniele Di Pompeo, Sebastian Frank, Pooyan Jamshidi, Michele Tucci, André van Hoorn
  venue: ACM Transactions on Software Engineering and Methodology
  venue_abb: TOSEM
  acc_rate:
  year: 2023
  url: https://arxiv.org/abs/2308.15084
  code: https://github.com/SpencerLabAQ/replication-package__interactive-search-based-software-performance
  video: 
  slide: 
  important:    
  badge-available: 
  badge-functional: 
  badge-reproduced: 
  abstract: "Software architecture optimization aims to enhance non-functional attributes like performance and reliability while meeting functional requirements. Multi-objective optimization employs metaheuristic search techniques, such as genetic algorithms, to explore feasible architectural changes and propose alternatives to designers. However, the resource-intensive process may not always align with practical constraints. This study investigates the impact of designer interactions on multi-objective software architecture optimization. Designers can intervene at intermediate points in the fully automated optimization process, making choices that guide exploration towards more desirable solutions. We compare this interactive approach with the fully automated optimization process, which serves as the baseline. The findings demonstrate that designer interactions lead to a more focused solution space, resulting in improved architectural quality. By directing the search towards regions of interest, the interaction uncovers architectures that remain unexplored in the fully automated process."

- id: independent-modular-networks
  title: "Independent Modular Networks"
  authors: Hamed Damirchi, Forest Agostinelli, Pooyan Jamshidi
  venue: Workshop on Effective Representations, Abstractions, and Priors for Robot Learning
  venue_abb: RAP4Robots at ICRA’23
  acc_rate:
  year: 2023
  url: https://arxiv.org/abs/2306.01316
  code: 
  video: 
  slide: 
  important:    
  badge-available: 
  badge-functional: 
  badge-reproduced: 
  abstract: "Monolithic neural networks that make use of a single set of weights to learn useful representations for downstream tasks explicitly dismiss the compositional nature of data generation processes. This characteristic exists in data where every instance can be regarded as the combination of an identity concept, such as the shape of an object, combined with modifying concepts, such as orientation, color, and size. The dismissal of compositionality is especially detrimental in robotics, where state estimation relies heavily on the compositional nature of physical mechanisms (e.g., rotations and transformations) to model interactions. To accommodate this data characteristic, modular networks have been proposed. However, a lack of structure in each module's role, and modular network-specific issues such as module collapse have restricted their usability. We propose a modular network architecture that accommodates the mentioned decompositional concept by proposing a unique structure that splits the modules into predetermined roles. Additionally, we provide regularizations that improve the resiliency of the modular network to the problem of module collapse while improving the decomposition accuracy of the model."

- id: care
  title: "CaRE: Finding Root Causes of Configuration Issues in Highly-Configurable Robots"
  authors: Md Abir Hossen, Sonam Kharade, Bradley Schmerl, Javier Cámara, Jason M. O'Kane, Ellen C. Czaplinski, Katherine A. Dzurilla, David Garlan, and Pooyan Jamshidi
  venue: IEEE Robotics and Automation Letters
  venue_abb: RA-L -> iROS'23
  acc_rate:
  year: 2023
  url: https://arxiv.org/abs/2301.07690
  code: https://github.com/softsys4ai/care
  video: https://www.youtube.com/watch?v=OomZr99hEKI&ab_channel=Abirhossen
  slide: https://speakerdeck.com/abirhossen/care-finding-root-causes-of-configuration-issues-in-highly-configurable-robots
  important: 1
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Robotic systems have several subsystems that possess a huge combinatorial configuration space and hundreds or even thousands of possible software and hardware configuration options interacting non-trivially. The configurable parameters can be tailored to target specific objectives, but when incorrectly configured, can cause functional faults. Finding the root cause of such faults is challenging due to the exponentially large configuration space and the dependencies between the robot's configuration settings and performance. This paper proposes CaRE, a method for diagnosing the root cause of functional faults through the lens of causality, which abstracts the causal relationships between various configuration options and the robot's performance objectives. We demonstrate CaRE's efficacy by finding the root cause of the observed functional faults via CaRE and validating the diagnosed root cause, conducting experiments in both physical robots (Husky and Turtlebot 3) and in simulation (Gazebo). Furthermore, we demonstrate that the causal models learned from robots in simulation (simulating Husky in Gazebo) are transferable to physical robots across different platforms (Turtlebot 3)."
  
- id: infadapter
  title: "Reconciling High Accuracy, Cost-Efficiency, and Low Latency of Inference Serving Systems"
  authors: Mehran Salmani, Saeid Ghafouri, Alireza Sanaee, Kamran Razavi, Max Mühlhäuser, Joseph Doyle, Pooyan Jamshidi, Mohsen Sharifi
  venue: The 3rd Workshop on Machine Learning and Systems
  venue_abb: EuroMLSys
  year: 2023
  code: https://github.com/reconfigurable-ml-pipeline/InfAdapter
  url: https://arxiv.org/abs/2304.10892
  important: 1
  abstract: "The use of machine learning (ML) inference for various applications is growing drastically. ML inference services engage with users directly, requiring fast and accurate responses. Moreover, these services face dynamic workloads of requests, imposing changes in their computing resources. Failing to right-size computing resources results in either latency service level objectives (SLOs) violations or wasted computing resources. Adapting to dynamic workloads considering all the pillars of accuracy, latency, and resource cost is challenging. In response to these challenges, we propose InfAdapter, which proactively selects a set of ML model variants with their resource allocations to meet latency SLO while maximizing an objective function composed of accuracy and cost. InfAdapter decreases SLO violation and costs up to 65% and 33%, respectively, compared to a popular industry autoscaler (Kubernetes Vertical Pod Autoscaler)."

- id: flexibo-jair
  title: "FlexiBO: A Decoupled Cost-Aware Multi-Objective Optimization Approach for Deep Neural Networks"
  authors: Shahriar Iqbal, Jianhai Su, Lars Kotthoff, Pooyan Jamshidi
  venue: Journal of Artificial Intelligence Research
  venue_abb: JAIR
  year: 2023
  code: https://github.com/softsys4ai/FlexiBO
  url: https://arxiv.org/abs/2001.06588
  slide: https://speakerdeck.com/pjamshidi/flexibo-a-decoupled-cost-aware-multi-objective-optimization-of-deep-neural-networks
  important: 1
  abstract: "The design of machine learning systems often requires trading off different objectives, for example, prediction error and energy consumption for deep neural networks (DNNs). Typically, no single design performs well in all objectives; therefore, finding Pareto-optimal designs is of interest. The search for Pareto-optimal designs involves evaluating designs in an iterative process, and the measurements are used to evaluate an acquisition function that guides the search process. However, measuring different objectives incurs different costs. For example, the cost of measuring the prediction error of DNNs is orders of magnitude higher than that of measuring the energy consumption of a pre-trained DNN, as it requires re-training the DNN. Current state-of-the-art methods do not consider this difference in objective evaluation cost, potentially incurring expensive evaluations of objective functions in the optimization process. In this paper, we develop a novel decoupled and cost-aware multi-objective optimization algorithm, we call Flexible Multi-Objective Bayesian Optimization (FlexiBO) to address this issue. FlexiBO weights the improvement of the hypervolume of the Pareto region by the measurement cost of each objective to balance the expense of collecting new information with the knowledge gained through objective evaluations, preventing us from performing expensive measurements for little to no gain. We evaluate FlexiBO on seven state-of-the-art DNNs for image recognition, natural language processing (NLP), and speech-to-text translation. Our results indicate that, given the same total experimental budget, FlexiBO discovers designs with 4.8% to 12.4% lower hypervolume error than the best method in state-of-the-art multi-objective optimization."

- id: dnn-caching
  title: "Improving the Performance of DNN-based Software Services using Automated Layer Caching"
  authors: Mohammadamin Abedi, Yani Ioannou, Pooyan Jamshidi, and Hadi Hemmati
  venue: Arxiv
  venue_abb:
  acc_rate:
  year: 2022
  url: https://arxiv.org/abs/2209.08625
  code: https://github.com/aminabedi/Automated-Layer-Caching
  video:
  slide:
  important:
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Deep Neural Networks (DNNs) have become an essential component in many application domains including web-based services. A variety of these services require high throughput and (close to) real-time features, for instance, to respond or react to users' requests or to process a stream of incoming data on time. However, the trend in DNN design is toward larger models with many layers and parameters to achieve more accurate results. Although these models are often pre-trained, the computational complexity in such large models can still be relatively significant, hindering low inference latency. Implementing a caching mechanism is a typical systems engineering solution for speeding up a service response time. However, traditional caching is often not suitable for DNN-based services. In this paper, we propose an end-to-end automated solution to improve the performance of DNN-based services in terms of their computational complexity and inference latency. Our caching method adopts the ideas of self-distillation of DNN models and early exits. The proposed solution is an automated online layer caching mechanism that allows early exiting of a large model during inference time if the cache model in one of the early exits is confident enough for final prediction. One of the main contributions of this paper is that we have implemented the idea as an online caching, meaning that the cache models do not need access to training data and perform solely based on the incoming data at run-time, making it suitable for applications using pre-trained models. Our experiments results on two downstream tasks (face and object classification) show that, on average, caching can reduce the computational complexity of those services up to 58% (in terms of FLOPs count) and improve their inference latency up to 46% with low to zero reduction in accuracy."

- id: felare-cloud22
  title: "FELARE: Fair Scheduling of Machine Learning Applications on Heterogeneous Edge Systems"
  authors: Ali Mokhtari, Abir Hossen, Pooyan Jamshidi, Mohsen Amini Salehi
  venue: International Conference on Cloud Computing
  venue_abb: IEEE CLOUD
  acc_rate: 20
  year: 2022
  url: https://arxiv.org/abs/2206.00065
  code: https://github.com/NSF-SmartSight/felare
  video:
  slide:
  important:
  badge-available:
  badge-functional:
  badge-reproduced:
  abstract: "Edge computing enables smart IoT-based systems via concurrent and continuous execution of latency-sensitive machine learning (ML) applications. These edge-based machine learning systems are often battery-powered (i.e., energy-limited). They use heterogeneous resources with diverse computing performance (e.g., CPU, GPU, and/or FPGAs) to fulfill the latency constraints of ML applications. The challenge is to allocate user requests for different ML applications on the Heterogeneous Edge Computing Systems (HEC) with respect to both the energy and latency constraints of these systems. To this end, we study and analyze resource allocation solutions that can increase the on-time task completion rate while considering the energy constraint. Importantly, we investigate edge-friendly (lightweight) multi-objective mapping heuristics that do not become biased toward a particular application type to achieve the objectives; instead, the heuristics consider fairness across the concurrent ML applications in their mapping decisions. Performance evaluations demonstrate that the proposed heuristic outperforms widely-used heuristics in heterogeneous systems in terms of the latency and energy objectives, particularly, at low to moderate request arrival rates. We observed 8.9% improvement in on-time task completion rate and 12.6% in energy-saving without imposing any significant overhead on the edge system."

- id: flexibo-automl22
  title: "Getting the Best Bang For Your Buck: Choosing What to Evaluate for Faster Bayesian Optimization"
  authors: Shahriar Iqbal, Jianhai Su, Lars Kotthoff, Pooyan Jamshidi
  venue: International Conference on Automated Machine Learning
  venue_abb: AutoML 2022
  acc_rate: 25
  year: 2022
