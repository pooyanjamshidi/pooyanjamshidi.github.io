- name: "AdaptiveFlow"
  id: sustainable-ml-pipeline
  start: 2022
  members: ghafouri
  papers: ipa
  description:  "In this collaborative project, we develop infrastructure, runtime methods, and tools to enable performance optimization of ML inference pipelines by runtime dataflow restructuring, resource adaptations, model switching, and configuration tuning of model server knobs, such as batch sizes. This project is led by the University of South Carolina (US) and in collaborations with Queens Marry (UK), Technical University of Darmstadt (Germany), Vrije Universiteit Amsterdam (Netherlands), and industrial partners, including Roblox (US). It is one of the projects in my group related to Design for Sustainability in Computing."
  webpage: https://github.com/reconfigurable-ml-pipeline 

- name: "AI for Symbolic Math"
  id: ai-math
  start: 2021
  members: noorbakhsh
  papers: symb-math-pretrained
  description: "Mathematics is one of the most precious human heritage. To preserve mathematical knowledge even beyond the human era, in collaborations with the University of Tartu, we develop new methods to solve symbolic math tasks (differentiation, integration, PDE, linear algebra, etc.) with machine learning models such as neural networks. The key ideas behind our approach are to exploit the underlying structures (e.g., tree-like structures) behind symbolic math tasks and transform the symbolic math tasks into tasks such as language translations that deep learning models can do well."
  webpage: https://softsys4ai.github.io/differentiable-proving/

- name: "NASA RASPBERRY-SI"
  id: raspberry-si
  start: 2020
  members: su
  papers: care
  description: "In this collaborative project (USC, CMU, York, UArk, NASA JPL/Ames/GRC), we develop technologies that enable learning-based autonomous planning and adaptation of space landers."
  webpage: https://nasa-raspberry-si.github.io/raspberry-si/

- name: "Causal AI: Structure Learning and Transfer Learning"
  id: causal-learning
  start: 2018
  members: javidian
  papers: lwf-markov-blankets,tl-causal
  description: "In this project, we are addressing the following important questions from theoretical and empirical perspectives: (i) How to learn reliable causal structures from data and how to use the learned causal structures for identifying causal invariances across environments? (ii) How to use the causal structure learning and counterfactual reasoning based on causal invariances for systems problems? In particular, we are extremely interested to apply these theoretical advancements for an explainable and guided performance debugging of highly-configurable systems."
  webpage: https://majavid.github.io/structurelearning

- name: ATHENA
  id: athena
  start: 2019
  members: meng,su
  papers: athena
  description: Despite achieving state-of-the-art performance across many domains, machine learning systems are highly vulnerable to subtle adversarial perturbations. In this project, we propose Athena, an extensible framework for building effective defenses to adversarial attacks against machine learning systems.
  webpage: https://softsys4ai.github.io/athena

- name: FlexiBO
  id: flexibo
  start: 2018
  members: iqbal,su
  papers: flexibo-jair
  description: One of the key challenges in designing machine learning systems is to determine the right balance amongst several objectives, which also oftentimes are incommensurable and conflicting. For example, when designing deep neural networks (DNNs), one often has to trade-off between multiple objectives, such as accuracy, energy consumption, and inference time. We developed FlexiBO, a flexible Bayesian optimization method, to address this issue. 
  webpage: https://github.com/softsys4ai/FlexiBO

- name: BRASS MARS
  id: brassmars
  start: 2016
  members: su
  papers: ml-planning-seams19,brass-ieee-software,tl-robot-seams17
  description: How do you build a software system that can function for a century without being touched by a human engineer? This is the herculean task being undertaken by the DARPA Building Resource Adaptive Software System’s (BRASS) program. We, at UofSC with several collborators at CMU, have been developing learning mechanisms to be integrated with quantitative planning to adapt/reconfigure robots to overcome environmental changes at runtime. 
  webpage: https://github.com/cmu-mars

